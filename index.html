<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FP-10 Controller</title>
<!--
  FP-10 Controller — single-file remote for the Roland FP-10 (transpose + voice).
  Protocol: see PROTOCOL.md next to this file. No external dependencies; works offline.
  Transports:
    • Web MIDI  (Android Chrome: first connect the piano with a BLE-MIDI app such as FluidSynth MIDI
                 or "MIDI BLE Connect" so Android creates the FP-10 MIDI device; USB cable on any OS)
    • Web Bluetooth (direct BLE; only works where the OS pairs the link itself — see PROTOCOL.md)
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #15191e; --muted: #5f6b78; --line: #dde2e8;
    --accent: #2f6fde; --accent-fg: #ffffff; --ok: #1f9d55; --warn: #c27c0e; --bad: #d23c3c;
    --chip: #eef2f7; --chip-on: #2f6fde; --chip-on-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1418; --card: #182027; --fg: #e8edf2; --muted: #93a1ae; --line: #2a3540;
      --accent: #5b93f5; --accent-fg: #0b1220; --ok: #3ccf7e; --warn: #f0b04a; --bad: #ff6b6b;
      --chip: #212b34; --chip-on: #5b93f5; --chip-on-fg: #0b1220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1418; --card: #182027; --fg: #e8edf2; --muted: #93a1ae; --line: #2a3540;
    --accent: #5b93f5; --accent-fg: #0b1220; --ok: #3ccf7e; --warn: #f0b04a; --bad: #ff6b6b;
    --chip: #212b34; --chip-on: #5b93f5; --chip-on-fg: #0b1220;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 12px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--chip); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 1.4em; }
  .tp { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; }
  .tp button { font-size: 28px; padding: 10px 0; }
  .tp .val { text-align: center; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tp .val small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .group { margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 9px 12px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-fg); font-weight: 600; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #log { font: 12px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; color: var(--muted); margin-top: 8px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1><span id="dot" class="dot"></span>FP-10 Controller</h1>

  <section class="card">
    <h2>Connection</h2>
    <div class="row">
      <button id="btnMidi" class="primary">Connect (MIDI)</button>
      <button id="btnBle">Connect (Bluetooth)</button>
      <button id="btnRefresh" disabled>Refresh</button>
    </div>
    <div id="status">Not connected.</div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card">
    <h2>Transpose</h2>
    <div class="tp">
      <button id="tpDown" disabled aria-label="Transpose down">−</button>
      <div class="val"><span id="tpVal">–</span><small id="tpNote">semitones</small></div>
      <button id="tpUp" disabled aria-label="Transpose up">+</button>
    </div>
    <div class="scale"><span>−6</span><button id="tpZero" class="chip" disabled>Reset to 0</button><span>+5</span></div>
  </section>

  <section class="card">
    <h2>Voice</h2>
    <div id="tones"></div>
  </section>

  <details>
    <summary>Log</summary>
    <div id="log"></div>
  </details>
</main>

<script>
"use strict";
// ---------------- protocol constants (verified on FP-10, see PROTOCOL.md) ----------------
const HEADER = [0xF0, 0x41, 0x10, 0x00, 0x00, 0x00, 0x28];
const ADDR = { remote: 0x01000306, tpWrite: 0x01000307, tpRead: 0x01000101, tone: 0x01000207 };
const WRITABLE = new Set([ADDR.remote, ADDR.tpWrite, ADDR.tone]);
const TP_MIN = -6, TP_MAX = 5;
const KEY_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
const GROUPS = [
  ["Pianos", 0, ["Grand Piano 1", "Grand Piano 2", "Grand Piano 3", "Grand Piano 4", "Ragtime Piano", "Harpsichord 1", "Harpsichord 2"]],
  ["E.Pianos & mallets", 1, ["E.Piano 1", "E.Piano 2", "E.Piano 3", "Clav", "Vibraphone", "Celesta", "Synth Bell"]],
  ["Strings, organs, choirs, guitars, basses", 2, ["Strings 1", "Strings 2", "Harp", "Jazz Organ 1", "Jazz Organ 2",
    "Church Organ 1", "Church Organ 2", "Accordion", "Choir 1", "Jazz Scat", "Choir 2", "Choir 3", "Synth Pad",
    "Nylon-str Gtr", "Steel-str Gtr", "Decay Strings", "Decay Choir", "Decay Choir Pad", "Acoustic Bass",
    "A.Bass + Cymbal", "Fingered Bass", "Thum Voice"]],
];
const HIDDEN = [[4, 0, "Saw/Square Lead"], [5, 0, "Sine Wave"]]; // 3/0 is accepted but silent: not offered

const $ = id => document.getElementById(id);
const hex = a => Array.from(a, b => b.toString(16).padStart(2, "0")).join(" ");
function log(s) { const l = $("log"); l.textContent = new Date().toTimeString().slice(0, 8) + " " + s + "\n" + l.textContent.slice(0, 30000); }
function status(s, state) { $("status").textContent = s; $("dot").className = "dot" + (state ? " " + state : ""); }

// ---------------- Roland SysEx ----------------
const checksum = a => (128 - (a.reduce((s, x) => s + x, 0) % 128)) % 128;
const addrBytes = a => [(a >>> 24) & 0x7F, (a >> 16) & 0x7F, (a >> 8) & 0x7F, a & 0x7F];
function rq1(addr, size) {
  const body = [...addrBytes(addr), (size >> 21) & 0x7F, (size >> 14) & 0x7F, (size >> 7) & 0x7F, size & 0x7F];
  return [...HEADER, 0x11, ...body, checksum(body), 0xF7];
}
function dt1(addr, data) {
  if (!WRITABLE.has(addr)) throw new Error("refusing to write unlisted address " + addr.toString(16));
  const body = [...addrBytes(addr), ...data];
  return [...HEADER, 0x12, ...body, checksum(body), 0xF7];
}
function parseDT1(m) {
  if (m.length < 14 || !HEADER.every((v, i) => m[i] === v) || m[7] !== 0x12) return null;
  const addr = ((m[8] << 24) | (m[9] << 16) | (m[10] << 8) | m[11]) >>> 0;
  return { addr, data: m.slice(12, -2), ok: checksum(m.slice(8, -2)) === m[m.length - 2] };
}

// ---------------- transports: both expose send(bytes) and call onMessage(bytes) ----------------
let transport = null;
const listeners = new Set();
function onMessage(m) { for (const f of [...listeners]) f(m); }

async function connectMidi() {
  if (!navigator.requestMIDIAccess) throw new Error("Web MIDI is not available in this browser.");
  const access = await navigator.requestMIDIAccess({ sysex: true });
  const match = p => /FP-?10|Roland/i.test(p.name) && p.state !== "disconnected";
  const ins = [...access.inputs.values()].filter(match), outs = [...access.outputs.values()].filter(match);
  log("MIDI inputs: " + [...access.inputs.values()].map(p => p.name + "(" + p.state + ")").join(", "));
  if (!ins.length || !outs.length) throw new Error("No FP-10 MIDI port. On Android, connect the piano first in a Bluetooth-MIDI app (e.g. FluidSynth MIDI), then reload this page.");
  // Android can list a stale FP-10 device next to the live one (same name). Listen on every candidate
  // input, then try each output until the piano answers an Identity Request.
  let heardOn = null;
  for (const inp of ins) {
    await inp.open();
    inp.onmidimessage = e => { const m = Array.from(e.data); if (m[0] === 0xF0 && m[1] === 0x7E && m[4] === 2) heardOn = inp; onMessage(m); };
  }
  let chosen = null;
  for (const out of outs.reverse()) {             // newest device is usually last
    await out.open();
    await new Promise(r => setTimeout(r, 300));    // first message right after open can be lost
    for (let a = 0; a < 2 && !chosen; a++) {
      const p = waitFor(m => (m[0] === 0xF0 && m[1] === 0x7E && m[3] === 6 && m[4] === 2) ? m : null, 1200);
      out.send([0xF0, 0x7E, 0x10, 0x06, 0x01, 0xF7]);
      if (await p) chosen = out;
    }
    log("output " + out.name + " [" + out.id + "]: " + (chosen === out ? "answers" : "no answer"));
    if (chosen) break;
  }
  const out = chosen || outs[0];
  const inp = heardOn || ins[ins.length - 1];
  for (const i of ins) if (i !== inp) i.onmidimessage = null;
  access.onstatechange = e => { if (e.port.id === inp.id && e.port.state === "disconnected") disconnected("MIDI port went away"); };
  return { name: "MIDI: " + inp.name, send: async m => out.send(m), close: async () => { inp.onmidimessage = null; } };
}

// BLE-MIDI framing
const SVC = "03b80e5a-ede8-4b33-a751-6ce34ec4c700", CHR = "7772e5db-3868-4112-a1a9-f2669d106bf3";
function packetize(msg, max = 20) {
  const t = Math.floor(performance.now()) & 0x1FFF, hdr = 0x80 | ((t >> 7) & 0x3F), ts = 0x80 | (t & 0x7F);
  if (msg[0] !== 0xF0) return [[hdr, ts, ...msg]];
  const pk = []; let cur = [hdr, ts, 0xF0];
  for (const b of msg.slice(1, -1)) { if (cur.length >= max) { pk.push(cur); cur = [hdr]; } cur.push(b); }
  if (cur.length + 2 > max) { pk.push(cur); cur = [hdr]; }
  cur.push(ts, 0xF7); pk.push(cur); return pk;
}
function makeParser() {
  let running = null, sysex = null;
  return pkt => {
    const out = [], n = pkt.length; if (n < 2 || !(pkt[0] & 0x80)) return out;
    let i = 1;
    while (i < n) {
      let b = pkt[i];
      if (sysex) {
        if (b & 0x80) { const nx = pkt[i + 1]; if (nx === 0xF7) { sysex.push(0xF7); out.push(sysex); sysex = null; i += 2; continue; }
          if (nx >= 0xF8) { i += 2; continue; } i++; continue; }
        sysex.push(b); i++; continue;
      }
      if (b & 0x80) { i++; if (i >= n) break; b = pkt[i];
        if (b & 0x80) { if (b === 0xF0) { sysex = [0xF0]; i++; continue; } if (b >= 0xF8) { i++; continue; } running = b; i++; } }
      if (running === null) { i++; continue; }
      const need = ((running & 0xF0) === 0xC0 || (running & 0xF0) === 0xD0) ? 1 : 2, d = Array.from(pkt.slice(i, i + need));
      if (d.length < need || d.some(x => x & 0x80)) { i++; continue; }
      out.push([running, ...d]); i += need;
    }
    return out;
  };
}
async function connectBle() {
  if (!navigator.bluetooth) throw new Error("Web Bluetooth is not available in this browser.");
  const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
  dev.addEventListener("gattserverdisconnected", () => disconnected("Bluetooth link dropped"));
  let gatt = null, err = null;
  for (let a = 1; a <= 4 && !gatt; a++) {
    try { gatt = await dev.gatt.connect(); } catch (e) { err = e; log("connect attempt " + a + ": " + e); await new Promise(r => setTimeout(r, 1000)); }
  }
  if (!gatt) throw err;
  const ch = await (await gatt.getPrimaryService(SVC)).getCharacteristic(CHR);
  const parse = makeParser();
  ch.addEventListener("characteristicvaluechanged", e => parse(new Uint8Array(e.target.value.buffer)).forEach(onMessage));
  await ch.startNotifications();
  return {
    name: "Bluetooth: " + dev.name,
    send: async m => { const pk = packetize(m); for (const p of pk) { await ch.writeValueWithoutResponse(new Uint8Array(p)); if (pk.length > 1) await new Promise(r => setTimeout(r, 15)); } },
    close: async () => { try { dev.gatt.disconnect(); } catch (_) {} },
  };
}

// ---------------- FP-10 commands ----------------
function waitFor(pred, ms = 1500) {
  return new Promise(res => {
    const f = m => { const r = pred(m); if (r) { listeners.delete(f); clearTimeout(t); res(r); } };
    const t = setTimeout(() => { listeners.delete(f); res(null); }, ms);
    listeners.add(f);
  });
}
let queue = Promise.resolve();               // serialise requests
const serial = fn => (queue = queue.then(fn, fn));
function read(addr, size) {
  return serial(async () => {
    for (let a = 0; a < 3; a++) {
      const p = waitFor(m => { const d = parseDT1(m); return d && d.addr === addr ? d : null; });
      await transport.send(rq1(addr, size));
      const d = await p; if (d) { if (!d.ok) throw new Error("bad checksum"); return d.data; }
    }
    throw new Error("no reply from piano (read " + addr.toString(16) + ")");
  });
}
let remoteOn = false;
async function write(addr, data) {
  if (!remoteOn) { await serial(() => transport.send(dt1(ADDR.remote, [1]))); remoteOn = true; }
  await serial(async () => { await transport.send(dt1(addr, data)); await new Promise(r => setTimeout(r, 60)); });
}
async function identity() {
  const p = waitFor(m => (m.length >= 15 && m[0] === 0xF0 && m[1] === 0x7E && m[3] === 6 && m[4] === 2) ? m : null, 2000);
  await serial(() => transport.send([0xF0, 0x7E, 0x10, 0x06, 0x01, 0xF7]));
  return p;
}

// ---------------- UI ----------------
let tpValue = null, toneCode = null, polling = null;
function renderTranspose() {
  $("tpVal").textContent = tpValue === null ? "–" : (tpValue > 0 ? "+" : "") + tpValue;
  $("tpNote").textContent = tpValue === null ? "semitones" : (tpValue === 0 ? "no transpose" : "C plays " + KEY_NAMES[(tpValue + 12) % 12]);
  const on = !!transport && tpValue !== null;
  $("tpDown").disabled = !on || tpValue <= TP_MIN; $("tpUp").disabled = !on || tpValue >= TP_MAX; $("tpZero").disabled = !on || tpValue === 0;
}
function renderTones() {
  const box = $("tones"); box.innerHTML = "";
  const add = (title, items) => {
    const g = document.createElement("div"); g.className = "group"; g.textContent = title; box.appendChild(g);
    const c = document.createElement("div"); c.className = "chips"; box.appendChild(c);
    for (const [cat, idx, name] of items) {
      const b = document.createElement("button"); b.className = "chip"; b.textContent = name;
      b.disabled = !transport; b.dataset.code = cat + "/" + idx;
      if (toneCode && toneCode[0] === cat && toneCode[2] === idx) b.classList.add("on");
      b.onclick = () => setTone(cat, idx, name); c.appendChild(b);
    }
  };
  for (const [title, cat, names] of GROUPS) add(title, names.map((n, i) => [cat, i, n]));
  add("Hidden (not on the panel)", HIDDEN);
}
async function refresh() {
  try {
    tpValue = (await read(ADDR.tpRead, 1))[0] - 0x40;
    toneCode = await read(ADDR.tone, 3);
    renderTranspose(); renderTones();
  } catch (e) { log("refresh: " + e.message); }
}
async function setTranspose(v) {
  v = Math.max(TP_MIN, Math.min(TP_MAX, v));
  try { await write(ADDR.tpWrite, [0x40 + v]); tpValue = (await read(ADDR.tpRead, 1))[0] - 0x40; renderTranspose();
    status(transport.name + " — transpose " + (tpValue > 0 ? "+" : "") + tpValue + (tpValue === v ? "" : " (piano clamped it)"), "ok");
  } catch (e) { status("Transpose failed: " + e.message, "bad"); }
}
async function setTone(cat, idx, name) {
  try { await write(ADDR.tone, [cat, 0, idx]); toneCode = await read(ADDR.tone, 3); renderTones();
    const ok = toneCode[0] === cat && toneCode[2] === idx;
    status(transport.name + " — " + (ok ? name : "piano reports " + hex(toneCode)), ok ? "ok" : "bad");
  } catch (e) { status("Voice change failed: " + e.message, "bad"); }
}
async function connect(kind) {
  if (transport) await disconnect();
  status("Connecting…", "busy");
  try {
    transport = kind === "midi" ? await connectMidi() : await connectBle();
    log("connected via " + transport.name);
    const id = await identity();
    if (!id) {
      status(transport.name + " — connected, but the piano doesn't answer. " +
        (kind === "ble" ? "This browser's Bluetooth link is probably unpaired/one-way; use MIDI (see PROTOCOL.md)." : ""), "bad");
      $("btnRefresh").disabled = false; renderTones(); return;
    }
    log("identity " + hex(id));
    status(transport.name + " — connected", "ok");
    $("btnRefresh").disabled = false;
    await refresh();
    clearInterval(polling);
    polling = setInterval(() => { if (!document.hidden && transport) refresh(); }, 4000);  // follow panel changes
  } catch (e) { transport = null; status(e.message, "bad"); log("connect error: " + e); }
}
function disconnected(why) { log(why); transport = null; remoteOn = false; clearInterval(polling); status("Disconnected (" + why + ").", "bad"); renderTranspose(); renderTones(); $("btnRefresh").disabled = true; }
async function disconnect() { try { await transport?.close(); } catch (_) {} transport = null; remoteOn = false; clearInterval(polling); }

$("btnMidi").onclick = () => connect("midi");
$("btnBle").onclick = () => connect("ble");
$("btnRefresh").onclick = refresh;
$("tpDown").onclick = () => setTranspose(tpValue - 1);
$("tpUp").onclick = () => setTranspose(tpValue + 1);
$("tpZero").onclick = () => setTranspose(0);

const caps = [];
if (!window.isSecureContext) caps.push("this page isn't a secure context, so MIDI/Bluetooth are blocked — open it from https:// or http://localhost");
if (!navigator.requestMIDIAccess) caps.push("no Web MIDI in this browser");
if (!navigator.bluetooth) caps.push("no Web Bluetooth in this browser");
$("hint").textContent = caps.length ? "Note: " + caps.join("; ") + "." :
  "Android: connect the FP-10 in a Bluetooth-MIDI app first (it shows a pairing prompt), then tap Connect (MIDI).";
renderTranspose(); renderTones();
log("loaded; secureContext=" + window.isSecureContext + " midi=" + !!navigator.requestMIDIAccess + " bluetooth=" + !!navigator.bluetooth + " protocol=" + location.protocol);
</script>
</body>
</html>
